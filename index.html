<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Token Dashboard</h1>
    <p class="subtitle">Cost, speed, modality, and usage for evaluated language models.</p>
    <p id="status" role="status">Loading model data…</p>
    <p id="error" role="alert" hidden></p>
    <div class="filters">
      <label>Model name <input type="search" id="filter-name" placeholder="e.g. kimi" autocomplete="off"></label>
      <label>Modality (input or output)
        <select id="filter-modality">
          <option value="All">All</option>
          <option value="Text">Text</option>
          <option value="Text+Image">Text+Image</option>
        </select>
      </label>
    </div>
    <div class="table-wrapper">
      <table id="models-table">
        <thead>
          <tr>
            <th rowspan="2" scope="col" data-sort-key="name"><button type="button" class="sort-btn">Model <span class="arrow" aria-hidden="true"></span></button></th>
            <th colspan="2" scope="colgroup">Usage cost ($/M)</th>
            <th rowspan="2" scope="col" data-sort-key="ttft"><button type="button" class="sort-btn">TTFT (ms) <span class="arrow" aria-hidden="true"></span></button></th>
            <th colspan="2" scope="colgroup">Content</th>
            <th colspan="2" scope="colgroup">Usage (tokens)</th>
          </tr>
          <tr>
            <th scope="col" data-sort-key="costIn"><button type="button" class="sort-btn">Cost In <span class="arrow" aria-hidden="true"></span></button></th>
            <th scope="col" data-sort-key="costOut"><button type="button" class="sort-btn">Cost Out <span class="arrow" aria-hidden="true"></span></button></th>
            <th scope="col" data-sort-key="inputModality"><button type="button" class="sort-btn">Input <span class="arrow" aria-hidden="true"></span></button></th>
            <th scope="col" data-sort-key="outputModality"><button type="button" class="sort-btn">Output <span class="arrow" aria-hidden="true"></span></button></th>
            <th scope="col" data-sort-key="daily"><button type="button" class="sort-btn">Daily usage <span class="arrow" aria-hidden="true"></span></button></th>
            <th scope="col" data-sort-key="weekly"><button type="button" class="sort-btn">Weekly usage <span class="arrow" aria-hidden="true"></span></button></th>
          </tr>
        </thead>
        <tbody id="models-body">
        </tbody>
      </table>
    </div>
    <p id="empty" hidden>No models match the current filters.</p>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
